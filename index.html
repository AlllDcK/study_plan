<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семестр · осень 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --grid:#E4EAF1;
  --line:#D6DEE9;
  --ink:#16203C;
  --ink-soft:#5C6A88;
  --ink-faint:#95A2BB;
  --rule:#B8433A;
  --done:#2C7A5B;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 28px),
    repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 28px);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  max-width:860px;
  margin:0 auto;
  padding:0 20px 80px 34px;
  position:relative;
}
.sheet::before{
  content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;
  background:var(--rule);opacity:.85;
}
@media(min-width:720px){
  .sheet{padding:0 40px 96px 72px}
  .sheet::before{left:44px}
}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px}

/* ── шапка ───────────────────────────── */
header{padding:34px 0 6px}
.brand{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;
  color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;
}
.brand b{font-weight:500;color:var(--ink)}
.hero{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:14px 0 4px}
.wknum{
  font-family:var(--serif);font-weight:600;font-size:66px;line-height:.86;
  letter-spacing:-.02em;
}
.wkmeta{padding-bottom:6px}
.wkdates{font-family:var(--mono);font-size:15px;color:var(--ink)}
.wkcount{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-top:2px}

/* полоса семестра: 13 недель */
.strip{display:flex;gap:3px;margin:18px 0 4px;align-items:flex-end}
.seg{
  flex:1;height:30px;border:1px solid var(--line);background:var(--card);
  padding:0;position:relative;border-radius:1px;overflow:hidden;
  transition:border-color .12s;
}
.seg span{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.78;transition:height .2s}
.seg em{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-style:normal;font-size:11px;color:var(--ink-soft);
  mix-blend-mode:multiply;
}
.seg:hover{border-color:var(--ink-faint)}
.seg.past span{opacity:.3}
.seg.cur{border-color:var(--rule);border-width:2px}
.seg.cur em{color:var(--rule);font-weight:500}
.striplbl{
  display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:11px;color:var(--ink-faint);margin-bottom:22px;
}

.nav{display:flex;gap:8px;margin:16px 0 0}
.nav button{
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:5px 12px;font-family:var(--mono);font-size:13px;color:var(--ink-soft);
}
.nav button:hover:not(:disabled){border-color:var(--ink-faint);color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}

.tabs{display:flex;gap:0;margin:26px 0 20px;border-bottom:1px solid var(--line)}
.tab{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:8px 16px 9px;color:var(--ink-soft);font-weight:500;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rule)}

/* ── контрольная точка ───────────────── */
.flag{
  border-left:3px solid var(--rule);background:var(--card);
  padding:10px 14px;margin:0 0 24px;font-size:14.5px;
}
.flag b{font-weight:600}

/* ── цели ────────────────────────────── */
.goal{margin:0 0 30px}
.goal h2{
  display:flex;align-items:baseline;gap:10px;margin:0 0 10px;
  font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;
}
.goal h2 i{
  font-style:normal;font-family:var(--mono);font-size:13px;color:var(--rule);
  border:1px solid var(--rule);border-radius:2px;width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.goal h2 small{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);font-weight:400}
ul.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.tasks li{border-bottom:1px solid var(--line)}
ul.tasks label{
  display:flex;gap:12px;align-items:flex-start;padding:11px 6px 11px 2px;
  cursor:pointer;background:var(--card);
}
ul.tasks label:hover{background:#FBFCFD}
ul.tasks input{
  appearance:none;width:17px;height:17px;flex:none;margin-top:3px;
  border:1.5px solid var(--ink-faint);border-radius:2px;background:#fff;position:relative;
}
ul.tasks input:checked{border-color:var(--done);background:var(--done)}
ul.tasks input:checked::after{
  content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
}
ul.tasks input:checked+span{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1px}
ul.tasks span{font-size:15px;line-height:1.45}

.seg.debt::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--rule)}
.debtline{font-family:var(--mono);font-size:12.5px;color:var(--rule);margin-top:3px}
.notes{margin:30px 0 0;border-top:1px solid var(--line);padding-top:14px}
.notes label{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-bottom:6px}
.notes textarea{
  width:100%;min-height:78px;resize:vertical;font-family:var(--sans);font-size:14.5px;line-height:1.5;
  padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink);
}
.notes textarea:focus{outline:none;border-color:var(--ink-faint)}
.titem.fix{border-left:3px solid var(--rule);padding-left:9px}

/* ── недельный график ────────────────── */
.day{border-top:1px solid var(--line);background:var(--card);padding:12px 12px 13px;display:flex;gap:16px;align-items:flex-start}
.day:last-of-type{border-bottom:1px solid var(--line)}
.day.today{border-left:3px solid var(--rule);padding-left:9px}
.dname{flex:0 0 118px}
.dname b{font-weight:600;font-size:15px;display:block}
.dname span{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}
.day.today .dname span{color:var(--rule)}
.blocks{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.block{display:flex;gap:10px;align-items:baseline}
.badge{
  font-family:var(--mono);font-size:11px;flex:none;width:20px;height:20px;border-radius:2px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--ink-faint);color:var(--ink-soft);position:relative;top:3px;
}
.badge.none{border-style:dashed;color:var(--ink-faint)}
.btext{flex:1;font-size:14.5px;min-width:0}
.bh{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);flex:none}
.bookrow{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-bottom:1px solid var(--line);padding:11px 12px}
.bshort{flex:0 0 108px;font-family:var(--mono);font-size:12px;color:var(--rule);padding-top:2px}
.bfull{flex:1;font-size:14.5px;line-height:1.45;min-width:0}
.bnote{display:block;font-size:13px;color:var(--ink-soft);margin-top:3px}
@media(max-width:560px){.bookrow{flex-direction:column;gap:4px}.bshort{flex:none}}
.phases{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.phase{
  background:var(--card);border:1px solid var(--line);border-radius:2px;padding:6px 12px;
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);
}
.phase:hover{border-color:var(--ink-faint);color:var(--ink)}
.phase.on{border-color:var(--rule);color:var(--ink);font-weight:500}
.loadnote{margin:22px 0 0;font-size:14px;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:12px}
.hours{margin:20px 0 0;border-top:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--card);font-size:14px}
.hrow b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-soft)}
.hrow.sum{background:none;border-bottom:0;font-weight:600}
.hrow.sum b{color:var(--ink)}

/* ── тесты ───────────────────────────── */
.tlist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.titem{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:var(--card);border-bottom:1px solid var(--line);
  padding:13px 12px;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;
}
.titem:hover{background:#FBFCFD}
.titem:disabled{opacity:.45;cursor:default;background:var(--card)}
.tname{font-weight:500;font-size:15px}
.tsub{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.tscore{font-family:var(--mono);font-size:13px;color:var(--ink-soft);flex:none}
.tscore.ok{color:var(--done)}

.paper{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px 18px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.qhead h2{font-family:var(--serif);font-size:21px;margin:0;font-weight:600}
.back{background:none;border:0;font-family:var(--mono);font-size:13px;color:var(--ink-soft);padding:0}
.back:hover{color:var(--rule)}
.qintro{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;font-family:var(--mono)}

.q{border-top:1px solid var(--line);padding:18px 0 4px}
.q:first-of-type{border-top:0;padding-top:4px}
.qtext{display:flex;gap:10px;margin:0 0 12px;font-size:15.5px;line-height:1.5}
.qtext i{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--ink-faint);flex:none;padding-top:2px}
.opts{display:flex;flex-direction:column;gap:2px;margin-left:26px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:2px;cursor:pointer}
.opt:hover{background:#F7F9FB}
.opt input{margin-top:4px;accent-color:var(--ink);flex:none}
.opt span{font-size:15px}
.opt.right{background:#EDF6F1}
.opt.wrong{background:#FBEEEC}
.fill{margin-left:26px}
.fill input{
  font-family:var(--mono);font-size:15px;padding:7px 10px;border:1px solid var(--line);
  border-radius:2px;width:100%;max-width:340px;background:#FCFDFE;color:var(--ink);
}
.fill input:focus{border-color:var(--ink-faint);outline:none;background:#fff}
.hintmulti{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin:-6px 0 8px 26px}
.verdict{margin:10px 0 0 26px;font-size:14px;border-left:2px solid var(--line);padding:2px 0 2px 12px}
.verdict b{font-weight:600}
.verdict.ok b{color:var(--done)}
.verdict.no b{color:var(--rule)}
.verdict.ok{border-left-color:var(--done)}
.verdict.no{border-left-color:var(--rule)}
.verdict p{margin:3px 0 0;color:var(--ink-soft)}

.actions{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.primary{
  background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:2px;
  padding:9px 20px;font-weight:500;
}
.primary:hover{background:#0E1730}
.ghost{background:none;border:1px solid var(--line);border-radius:2px;padding:9px 16px;color:var(--ink-soft)}
.ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.result{font-family:var(--mono);font-size:14px}

.ftools{display:flex;gap:16px;flex-wrap:wrap}
.syncbox{margin-top:18px;border:1px solid var(--line);background:var(--card);border-radius:2px;padding:16px}
.syncbox p{margin:0 0 10px;font-size:14px}
.syncbox textarea{
  width:100%;min-height:90px;resize:vertical;font-family:var(--mono);font-size:11.5px;line-height:1.45;
  padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:#FCFDFE;color:var(--ink-soft);
}
.syncrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.synchint{margin:12px 0 0!important;font-size:12.5px;color:var(--ink-faint)}
.warnmem{border-left:3px solid var(--rule);background:var(--card);padding:9px 13px;margin:0 0 18px;font-size:13.5px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
footer button{background:none;border:0;color:var(--ink-faint);text-decoration:underline;padding:0;font-family:var(--mono);font-size:12px}
footer button:hover{color:var(--rule)}
.empty{color:var(--ink-faint);font-size:15px;padding:20px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:560px){
  .wknum{font-size:52px}
  .seg em{font-size:10px}
  .strip{gap:2px}
}
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="brand"><b>Учебный семестр</b><span>14 сентября — 13 декабря 2026</span></div>

    <div class="strip" id="strip"></div>
    <div class="striplbl"><span>сентябрь</span><span>октябрь</span><span>ноябрь</span><span>декабрь</span></div>

    <div class="hero">
      <div class="wknum" id="wknum">1</div>
      <div class="wkmeta">
        <div class="wkdates" id="wkdates"></div>
        <div class="wkcount" id="wkcount"></div>
        <div class="debtline" id="wkdebt"></div>
      </div>
    </div>
    <div class="nav">
      <button id="prev">← предыдущая</button>
      <button id="next">следующая →</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-goals" aria-selected="true">Цели недели</button>
    <button class="tab" role="tab" id="tab-plan" aria-selected="false">График недели</button>
    <button class="tab" role="tab" id="tab-tests" aria-selected="false">Тесты</button>
    <button class="tab" role="tab" id="tab-books" aria-selected="false">Книги</button>
  </div>

  <div class="warnmem" id="warnmem" hidden></div>
  <main id="view"></main>

  <footer>
    <span id="total">—</span>
    <span class="ftools">
      <button id="sync">Перенести на другое устройство</button>
      <button id="reset">Сбросить весь прогресс</button>
    </span>
  </footer>
  <div class="syncbox" id="syncbox" hidden>
    <p id="syncnote"></p>
    <textarea id="synctext" spellcheck="false"></textarea>
    <div class="syncrow">
      <button class="primary" id="syncapply">Загрузить из поля</button>
      <button class="ghost" id="synccopy">Скопировать</button>
      <button class="ghost" id="syncclose">Закрыть</button>
    </div>
    <p class="synchint">Скопируйте строку на одном устройстве, вставьте в это поле на другом и нажмите «Загрузить из поля». Прогресс хранится в каждом браузере отдельно, поэтому переносить нужно вручную.</p>
  </div>
</div>

<script>
/* ══════════ данные ══════════ */

const GOALS = [
  {id:'py',  num:3, title:'Python · FastAPI с нуля',              note:'приоритет 1'},
  {id:'imad',num:3, title:'ИМАД · университетский курс',          note:'приоритет 1'},
  {id:'java',num:2, title:'Java · Android Studio',                note:'приоритет 2'},
  {id:'umf', num:1, title:'Уравнения математической физики',      note:'приоритет 3'},
  {id:'vkr', num:4, title:'ВКР · выпуклые множества',             note:'приоритет 4'},
  {id:'opt', num:4, title:'Методы оптимизации · четыре книги',     note:'приоритет 4'},
  {id:'crm', num:5, title:'Daily-CRM · Nuxt',                     note:'приоритет 5'},
  {id:'sp',  num:6, title:'Случайные процессы · самостоятельно', note:'опора для цели 6'},
  {id:'pto', num:6, title:'Predict-then-Optimize · Байкал',       note:'приоритет 6'}
];

const WEEKS = [
{n:1, dates:'14 — 20 сентября', t:{
  py:['Виртуальное окружение, установка fastapi и uvicorn','Аннотации типов в Python: зачем они FastAPI','async / await: что это и когда действительно нужно','Первое приложение, запуск uvicorn, разбор /docs и /redoc'],
  java:['Установить JDK и IntelliJ IDEA, первая программа','Примитивные типы, переменные, приведение типов','Условия, циклы, ввод-вывод — 20 простых задач'],

  pto:[]}},

{n:2, dates:'21 — 27 сентября', flag:'Контрольная точка 27 сентября: первый срез по всем целям.', t:{
  py:['Path-параметры и их типизация','Query-параметры, значения по умолчанию, Optional','Enum как тип параметра','Порядок маршрутов: почему /users/me должен идти раньше /users/{id}','Собрать API-справочник на 6 эндпоинтов без базы'],
  java:['Массивы и строки','Методы, передача аргументов, рекурсия','Андерсон, гл. 5: алгоритмы и рекурсия, упражнения с ответами','30 задач на Stepik или 15 задач с acmp.ru'],
  vkr:['Сузить тему: чем ваша постановка отличается от найденных работ','Выписать, какие результаты обзора можно переиспользовать','Васильев, ч. II гл. 10 §2 «Общие условия аппроксимации» — образец того, как формулируют сходимость аппроксимаций','Тыртышников 20.4–20.8: угловые точки, полиэдры и их грани, конечно порождённый конус — язык, на котором формулируется ваша тема'],
  crm:['Закрыть три самых критичных бага'],
  pto:[]}},

{n:3, dates:'28 сентября — 4 октября', flag:'4 октября: постановка задачи ВКР согласована с научруком письменно.', t:{
  py:['Pydantic v2: BaseModel, типы полей','Вложенные модели, тело запроса','response_model: что уходит наружу','Field и field_validator'],
  java:['Классы, конструкторы, инкапсуляция','this, static, области видимости','Первая программа из нескольких классов'],
  vkr:['Формальная постановка задачи, одна страница','Согласовать постановку с научруком письменно'],
  crm:['Разбор оставшихся багов по приоритету'],
  pto:['Прочитать Elmachtoub & Grigas — Smart Predict-then-Optimize','Понять, почему малая ошибка прогноза ≠ хорошее решение']}},

{n:4, dates:'5 — 11 октября', t:{
  py:['APIRouter и разбиение проекта на модули','Настройки через pydantic-settings','HTTPException и осмысленные статус-коды','Единый обработчик исключений'],
  java:['Наследование, полиморфизм','Абстрактные классы и интерфейсы','Коллекции: List, Set, Map — какая когда','Контест: Codeforces Div. 3 только на Java, цель 3+ задачи'],
  vkr:['Определить набор тестовых множеств для экспериментов','Выбрать метрику качества аппроксимации'],

    if(!list.length) return '';
    const g=gmap[gid];
    return `<section class="goal">
      <h2><i>${g.num}</i>${g.title}</h2>
      <div class="tlist">${list.map(b=>`<div class="bookrow">

        <span class="bfull">${b.full}<span class="bnote">${b.note}</span></span>
      </div>`).join('')}</div></section>`;
  }).join('');
}

const KEY = 'semestr2026:state';

/* Хранилище: внутри Claude — window.storage, в обычном браузере — localStorage,
   если недоступно ничего — память на время сессии. */
const STORE = (function(){
  try{
    if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){
      return {kind:'claude',
        get: async k => { const r = await window.storage.get(k); return r ? r.value : null; },
        set: async (k,v) => { await window.storage.set(k,v); }};
    }
  }catch(e){}
  try{
    const probe='__probe__';
    localStorage.setItem(probe,'1'); localStorage.removeItem(probe);
    return {kind:'local',
      get: async k => localStorage.getItem(k),
      set: async (k,v) => { localStorage.setItem(k,v); }};
  }catch(e){}
  const mem={};
  return {kind:'memory', get: async k => (k in mem ? mem[k] : null), set: async (k,v) => { mem[k]=v; }};
})();
let state = {checks:{}, tests:{}, mistakes:{}, notes:{}};
let week = 1, tab = 'goals', openTest = null, answers = {}, graded = null, phase = null;

async function load(){
  try{
    const raw = await STORE.get(KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ /* первый запуск или повреждённые данные — начинаем с чистого листа */ }
  if(!state.checks) state.checks = {};
  if(!state.tests) state.tests = {};
  if(!state.mistakes) state.mistakes = {};
  if(!state.notes) state.notes = {};
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await STORE.set(KEY, JSON.stringify(state)); }catch(e){}
  }, 250);
}

/* текущая неделя по календарю */
function currentWeek(){
  const start = new Date(2026,8,14);
  const d = Math.floor((new Date() - start)/(7*24*3600*1000)) + 1;
  return Math.min(13, Math.max(1, d));
}

  const out = [];
  GOALS.forEach(g=>{
    const list = (WEEKS[w-1].t[g.id]||[]);
    if(list.length) out.push({g, list});
  });
  return out;
}
function isBehind(w){
  const st = weekStats(w);
  return w < currentWeek() && st.all > 0 && st.done < st.all;
}
function debtCount(){
  const cur = currentWeek(); let n = 0;
  for(let w=1; w<cur; w++){ const st = weekStats(w); n += st.all - st.done; }
  return n;
}
function weekStats(w){
  let done=0, all=0;
  weekTasks(w).forEach(({g,list})=>list.forEach((_,i)=>{
    all++; if(state.checks[`${w}:${g.id}:${i}`]) done++;
  }));
  return {done, all};
}

/* ══════════ отрисовка ══════════ */

const $ = id => document.getElementById(id);

function renderHeader(){
  const w = WEEKS[week-1], s = weekStats(week);
  $('wknum').textContent = week;
  $('wkdates').textContent = w.dates;
  $('wkcount').textContent = s.all ? `выполнено ${s.done} из ${s.all}` : 'на этой неделе задач нет';
  const behind = debtCount();
  $('wkdebt').textContent = behind ? `хвостов с прошлых недель: ${behind}` : '';
  $('prev').disabled = week===1;
  $('next').disabled = week===13;

  const cur = currentWeek();
  $('strip').innerHTML = WEEKS.map(x=>{
    const st = weekStats(x.n);
    const pct = st.all ? Math.round(st.done/st.all*100) : 0;
    const cls = ['seg', x.n===week?'cur':'', x.n<cur?'past':'', isBehind(x.n)?'debt':''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-w="${x.n}" title="Неделя ${x.n}: ${x.dates}">
      <span style="height:${pct}%"></span><em>${x.n}</em></button>`;
  }).join('');
  $('strip').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{week=+b.dataset.w; openTest=null; render();});

  let d=0,a=0;
  WEEKS.forEach(x=>{const s2=weekStats(x.n); d+=s2.done; a+=s2.all;});
  $('total').textContent = `семестр: ${d} из ${a} задач${a?` · ${Math.round(d/a*100)} %`:''}`;
}

function renderGoals(){
  const blocks = weekTasks(week);
  if(!blocks.length) return `<p class="empty">На этой неделе по плану ничего нет. Хороший повод разгрести хвосты предыдущей.</p>`;
  const w = WEEKS[week-1];
  let html = w.flag ? `<div class="flag"><b>${w.flag}</b></div>` : '';
  html += blocks.map(({g,list})=>`
    <section class="goal">
      <h2><i>${g.num}</i>${g.title} <small>${g.note}</small></h2>
      <ul class="tasks">${list.map((t,i)=>{
        const k = `${week}:${g.id}:${i}`;
        return `<li><label><input type="checkbox" data-k="${k}" ${state.checks[k]?'checked':''}><span>${t}</span></label></li>`;
      }).join('')}</ul>
    </section>`).join('');
  html += `<div class="notes">
    <label for="wknote">Заметки к неделе ${week}: что сказали на паре, что уточнить у научрука, чего не хватило</label>
    <textarea id="wknote" placeholder="…">${(state.notes[week]||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</textarea></div>`;
  return html;
}

function renderSchedule(){
  const key = phase || (week<=7 ? 'a' : 'b');
  const sch = SCHEDULES[key];
  const auto = (week<=7 ? 'a' : 'b');
  const today = (new Date().getDay()+6)%7;   // 0 — понедельник
  const gmap = {}; GOALS.forEach(g=>gmap[g.id]=g);
  const hours = {};
  let total = 0;

  const tabs = `<div class="phases">` + ['a','b'].map(k=>{
    const on = k===key;
    return `<button class="phase ${on?'on':''}" data-p="${k}">${SCHEDULES[k].title}${k===auto?' ·':''}</button>`;
  }).join('') + `</div>`;

  const days = sch.days.map((d,i)=>{
    const blocks = d.b.map(b=>{
      const num = b.g ? gmap[b.g].num : '·';
      const name = b.g ? gmap[b.g].title : 'Ревью недели';
      const val = parseFloat(b.h.replace(',','.'));
      hours[name] = (hours[name]||0) + val; total += val;
      return `<div class="block">
        <span class="badge ${b.g?'':'none'}" title="${b.g?gmap[b.g].title:'без привязки к цели'}">${num}</span>
        <span class="btext">${b.t}</span><span class="bh">${b.h}</span></div>`;
    }).join('');
    const dh = d.b.reduce((a,b)=>a+parseFloat(b.h.replace(',','.')),0);
    const isToday = (key===auto) && i===today;
    return `<div class="day ${isToday?'today':''}">
      <div class="dname"><b>${d.d}</b><span>${d.tag} · ${String(dh).replace('.',',')} ч</span></div>
      <div class="blocks">${blocks}</div></div>`;
  }).join('');

  const rows = Object.entries(hours).sort((a,b)=>b[1]-a[1])
    .map(([k2,v])=>`<div class="hrow"><span>${k2}</span><b>${String(v).replace('.',',')} ч</b></div>`).join('');

  return tabs + `<p class="loadnote">${sch.note}</p>` + days + `
    <p class="loadnote">Пары идут в среду, четверг и пятницу — эти дни разгружены намеренно.
    Основная работа приходится на вторник, субботу и воскресенье. Понедельник лёгкий: он нужен, чтобы
    после тяжёлого воскресенья не начинать неделю с провала.</p>
    <div class="hours">${rows}
      <div class="hrow sum"><span>всего в неделю, помимо пар</span><b>${String(total).replace('.',',')} ч</b></div>
    </div>`;
}

function norm(s){
  return (s||'').toLowerCase().trim().replace(/ё/g,'е')
    .replace(/[«»"'`.,;:!?()]/g,'').replace(/\s+/g,' ');
}

function mistakeSet(){
  const out = [];
  Object.keys(state.mistakes||{}).forEach(k=>{
    const [tid, qi] = k.split('|');
    const t = TESTS.find(x=>x.id===tid);
    if(t && t.q[+qi]) out.push({tid, qi:+qi, q:t.q[+qi]});
  });
  return out;
}
function mistakeTest(){
  const set = mistakeSet();
  return {id:'__fix', name:'Работа над ошибками', topic:'по всем темам',
          q:set.map(x=>x.q), _map:set.map(x=>({tid:x.tid, qi:x.qi}))};
}

function renderTestList(){
  const fix = mistakeSet();
  const word = fix.length%10===1 && fix.length%100!==11 ? 'вопрос' : 'вопросов';
  const head = fix.length ? `<button class="titem fix" data-t="__fix">
      <span><span class="tname">Работа над ошибками</span>
      <span class="tsub">по всем темам · ${fix.length} ${word} · ответите верно — вопрос уйдёт из набора</span></span>
      <span class="tscore">→</span></button>` : '';
  return `<div class="tlist">${head}${TESTS.map(t=>{
    const open = week >= t.from;
    const r = state.tests[t.id];
    const score = r ? `${r.best} / ${r.total}` : '—';
    const ok = r && r.best/r.total >= 0.8;
    return `<button class="titem" data-t="${t.id}" ${open?'':'disabled'}>
      <span><span class="tname">${t.name}</span>
      <span class="tsub">${t.topic} · ${t.q.length} вопросов · ${open?'доступен':'откроется на неделе '+t.from}</span></span>
      <span class="tscore ${ok?'ok':''}">${score}</span></button>`;
  }).join('')}</div>`;
}

function renderTest(t){
  const qs = t.q.map((q,i)=>{
    const g = graded ? graded[i] : null;
    let body = '';
    if(q.t==='fill'){
      body = `<div class="fill"><input type="text" data-q="${i}" value="${(answers[i]||'').replace(/"/g,'&quot;')}"
        placeholder="ответ" autocomplete="off" ${graded?'disabled':''}></div>`;
    }else{
      const many = q.t==='many';
      const sel = answers[i];
      body = (many?`<p class="hintmulti">можно отметить несколько</p>`:'') + `<div class="opts">` + q.o.map((o,j)=>{
        const checked = many ? (Array.isArray(sel)&&sel.includes(j)) : sel===j;
        let cls='opt';
        if(graded){
          const right = many ? q.a.includes(j) : q.a===j;
          if(right) cls+=' right';
          else if(checked) cls+=' wrong';
        }
        return `<label class="${cls}"><input type="${many?'checkbox':'radio'}" name="q${i}" data-q="${i}" data-o="${j}"
          ${checked?'checked':''} ${graded?'disabled':''}><span>${o}</span></label>`;
      }).join('') + `</div>`;
    }
    let verdict = '';
    if(graded){
      const right = q.t==='fill' ? q.a[0] : (q.t==='many' ? q.a.map(x=>q.o[x]).join(' · ') : q.o[q.a]);
      verdict = `<div class="verdict ${g?'ok':'no'}">
        <b>${g?'Верно.':'Неверно. Правильный ответ: '+right}</b>
        <p>${q.e}</p></div>`;
    }
    return `<div class="q"><p class="qtext"><i>${i+1}</i><span>${q.q}</span></p>${body}${verdict}</div>`;
  }).join('');

  let foot;
  if(graded){
    const n = graded.filter(Boolean).length;
    foot = `<div class="actions">
      <span class="result">Результат: ${n} из ${t.q.length}</span>
      <button class="ghost" id="again">Пройти заново</button>
      <button class="ghost" id="tolist">К списку тестов</button></div>`;
  }else{
    foot = `<div class="actions">
      <button class="primary" id="check">Проверить ответы</button>
      <button class="ghost" id="tolist">Отмена</button></div>`;
  }

  return `<div class="paper">
    <div class="qhead"><h2>${t.name}</h2><button class="back" id="back">← к списку</button></div>
    <p class="qintro">${t.topic} · ${t.q.length} вопросов</p>
    ${qs}${foot}</div>`;
}

function render(){
  renderHeader();
  $('tab-goals').setAttribute('aria-selected', tab==='goals');
  $('tab-plan').setAttribute('aria-selected', tab==='plan');
  $('tab-tests').setAttribute('aria-selected', tab==='tests');
  $('tab-books').setAttribute('aria-selected', tab==='books');
  const v = $('view');

  if(tab==='books'){ v.innerHTML = renderBooks(); return; }

  if(tab==='plan'){
    v.innerHTML = renderSchedule();
    v.querySelectorAll('.phase').forEach(b=>b.onclick=()=>{ phase = b.dataset.p; render(); });
    return;
  }

  if(tab==='goals'){
    v.innerHTML = renderGoals();
    v.querySelectorAll('input[type=checkbox]').forEach(c=>{
      c.onchange = ()=>{
        if(c.checked) state.checks[c.dataset.k]=true; else delete state.checks[c.dataset.k];
        save(); renderHeader();
      };
    });
    const note = $('wknote');
    if(note) note.oninput = ()=>{
      const val = note.value;
      if(val.trim()) state.notes[week] = val; else delete state.notes[week];
      save();
    };
    return;
  }

  if(!openTest){ v.innerHTML = renderTestList();
    v.querySelectorAll('.titem').forEach(b=>b.onclick=()=>{
      openTest = b.dataset.t; answers={}; graded=null; render(); window.scrollTo({top:0,behavior:'smooth'});
    });
    return;
  }

  const t = openTest==='__fix' ? mistakeTest() : TESTS.find(x=>x.id===openTest);
  if(!t || !t.q.length){ openTest=null; render(); return; }
  v.innerHTML = renderTest(t);

  v.querySelectorAll('.opt input').forEach(inp=>{
    inp.onchange = ()=>{
      const i=+inp.dataset.q, j=+inp.dataset.o;
      if(t.q[i].t==='many'){
        const cur = Array.isArray(answers[i])?answers[i]:[];
        answers[i] = inp.checked ? [...cur, j] : cur.filter(x=>x!==j);
      }else answers[i]=j;
    };
  });
  v.querySelectorAll('.fill input').forEach(inp=>{
    inp.oninput = ()=>{ answers[+inp.dataset.q]=inp.value; };
  });

  const back = ()=>{ openTest=null; graded=null; answers={}; render(); };
  const b1=$('back'), b2=$('tolist'); if(b1) b1.onclick=back; if(b2) b2.onclick=back;
  const ag=$('again'); if(ag) ag.onclick=()=>{ answers={}; graded=null; render(); window.scrollTo({top:0,behavior:'smooth'}); };

  const ch=$('check');
  if(ch) ch.onclick=()=>{
    graded = t.q.map((q,i)=>{
      const a = answers[i];
      if(q.t==='fill') return q.a.some(x=>norm(x)===norm(a));
      if(q.t==='many'){
        const s=(Array.isArray(a)?a:[]).slice().sort().join(',');
        return s===q.a.slice().sort().join(',');
      }
      return a===q.a;
    });
    const n = graded.filter(Boolean).length;
    if(t.id==='__fix'){
      t._map.forEach((m,i)=>{ if(graded[i]) delete state.mistakes[`${m.tid}|${m.qi}`]; });
    }else{
      graded.forEach((ok,i)=>{
        const key = `${t.id}|${i}`;
        if(ok) delete state.mistakes[key]; else state.mistakes[key] = true;
      });
      const prev = state.tests[t.id];
      state.tests[t.id] = {best: Math.max(n, prev?prev.best:0), total: t.q.length, last: n};
    }
    save(); render(); window.scrollTo({top:0,behavior:'smooth'});
  };
}

/* ══════════ запуск ══════════ */
$('prev').onclick = ()=>{ if(week>1){week--; openTest=null; render();} };
$('next').onclick = ()=>{ if(week<13){week++; openTest=null; render();} };
$('tab-goals').onclick = ()=>{ tab='goals'; render(); };
$('tab-plan').onclick  = ()=>{ tab='plan'; openTest=null; phase=null; render(); };
$('tab-tests').onclick = ()=>{ tab='tests'; openTest=null; render(); };
$('tab-books').onclick = ()=>{ tab='books'; openTest=null; render(); };
if(STORE.kind==='memory'){
  const w=$('warnmem'); w.hidden=false;
  w.textContent='Браузер не даёт сохранять данные: галочки и результаты тестов пропадут при закрытии страницы. Чаще всего дело в режиме инкогнито или в открытии файла из мессенджера — попробуйте открыть его в обычной вкладке браузера.';
}

$('sync').onclick = ()=>{
  const box=$('syncbox'); box.hidden=!box.hidden;
  if(!box.hidden){
    $('synctext').value = JSON.stringify(state);
    $('syncnote').textContent = 'Ниже — весь ваш прогресс одной строкой.';
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
};
$('syncclose').onclick = ()=>{ $('syncbox').hidden = true; };
$('synccopy').onclick = async ()=>{
  const ta=$('synctext'); ta.select(); ta.setSelectionRange(0, 999999);
  try{ await navigator.clipboard.writeText(ta.value); $('syncnote').textContent='Скопировано.'; }
  catch(e){ $('syncnote').textContent='Скопируйте выделенный текст вручную.'; }
};
$('syncapply').onclick = ()=>{
  let parsed;
  try{ parsed = JSON.parse($('synctext').value.trim()); }
  catch(e){ $('syncnote').textContent='Не похоже на сохранённый прогресс: строка не читается.'; return; }
  if(!parsed || typeof parsed!=='object' || !('checks' in parsed)){
    $('syncnote').textContent='Не похоже на сохранённый прогресс: нет ожидаемых полей.'; return;
  }
  state = {checks:parsed.checks||{}, tests:parsed.tests||{}, mistakes:parsed.mistakes||{}, notes:parsed.notes||{}};
  save(); openTest=null; graded=null; render();
  $('syncnote').textContent='Прогресс загружен.';
};

$('reset').onclick = ()=>{
  if(!confirm('Снять все галочки и удалить результаты тестов?')) return;
  state={checks:{},tests:{},mistakes:{},notes:{}}; save(); openTest=null; graded=null; render();
};

(async ()=>{ await load(); week = currentWeek(); render(); })();
</script>
</body>
</html>
